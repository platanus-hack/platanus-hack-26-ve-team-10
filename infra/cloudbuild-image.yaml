# Solo construye y sube una imagen. Lo usan los scripts de infra (50 y 51) vía build_image;
# los pipelines de CI (cloudbuild.web.yaml y cloudbuild.api.yaml) hacen lo mismo y además despliegan.
# Se envía el repo entero, así que _CONTEXT puede ser la raíz (web) o apps/api.
substitutions:
  _DOCKERFILE: apps/api/Dockerfile
  _CONTEXT: apps/api
  _IMAGE: ""
  _TAG: manual
  _API_URL: ""   # solo la web: se pasa como --build-arg API_URL

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        BUILD_ARGS=""
        if [ -n "${_API_URL}" ]; then BUILD_ARGS="--build-arg API_URL=${_API_URL}"; fi
        docker build -f "${_DOCKERFILE}" $$BUILD_ARGS -t "${_IMAGE}:${_TAG}" -t "${_IMAGE}:latest" "${_CONTEXT}"

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest
