# Copia main del repo de la org a Pleo2/prais.com, que es de donde publica Cloudflare Pages.
# El repo de la org es público, así que no hace falta token para leerlo.
name: Sync desde el repo de la org

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-org
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Pleo2/prais.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Solo fast-forward: si prais.com tiene commits que la org no tiene, falla en vez de borrarlos.
      # Un cambio en .github/workflows no se puede subir con este token: ese push hay que hacerlo desde local.
      - name: Traer main de la org
        run: |
          git fetch https://github.com/platanus-hack/platanus-hack-26-ve-team-10.git main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "prais.com ya está al día."
            exit 0
          fi
          git push origin FETCH_HEAD:refs/heads/main
